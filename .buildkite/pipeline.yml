steps:
  - label: ":jest: Unit Tests"
    command:
      - "node --version"
      - "npm --version"
      - "npm ci"
      - "npm test -- --watchAll=false"

  - label: ":playwright: End2End"
    artifact_paths:
      - "playwright/**/*.png"
      - "playwright-report/**/*"
      - "test-results/**/*"
    command:
      - "node --version"
      - "npm --version"
      - "npm ci"
      - "npx playwright install --with-deps chromium"
      - "npm run End2End"
